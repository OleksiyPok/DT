<!DOCTYPE html>
<html lang="en" class="theme-yellowblue-normal">
  <head>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta charset="UTF-8" />
    <title>Dual Translator</title>

    <!-- Applies the saved theme before first paint (no flash) -->
    <script src="script/themeRegistry.js?v=2.3.3"></script>

    <script src="script/ui_DT_texts.js?v=2.3.3" defer></script>
    <script src="script/script.js?v=2.3.3" defer></script>
    <link rel="stylesheet" href="styles/styles.css?v=2.3.3" />
    <link rel="stylesheet" href="styles/themes.css?v=2.3.3" />
  </head>
  <!-- DT -->
  <body>
    <div class="scroll-container" id="scrollContainer">
      <div class="layout">
        <div class="titles-container" id="titlesContainer">
          <img
            class="title-icon"
            id="titleIcon"
            src="icons/icon_DT_64x64.png"
            alt="Icon"
          />
          <div class="title-text" id="titleText">
            <h2>Dual Translator<br /></h2>
            <h6 id="version" class="version">version: 2.3.3</h6>
          </div>
        </div>
        <h5>Oleksii Pokormiakho</h5>

        <!-- Top row: help + settings buttons, theme mode -->
        <div class="setting-row" id="settingsRow">
          <div class="setting-buttons">
            <button
              type="button"
              class="help-app-btn"
              id="helpAppBtn"
              title="Help"
              aria-label="Help"
            >
              <span class="i-icon">ℹ️</span>
            </button>
            <button
              type="button"
              class="settings-app-btn"
              id="settingsAppBtn"
              title="Settings"
              aria-label="Settings"
            >
              <span class="gear-icon">⚙️</span>
            </button>
          </div>
          <div class="ui-language-wrapper" id="themaModeWrapper">
            <label
              for="themaModeSelect"
              id="labelThemaMode"
              class="ui-lang-label"
              >Mode</label
            >
            <select
              class="ui-lang-select"
              id="themaModeSelect"
              title="Select theme mode"
            >
              <option value="contrast">Contrast</option>
              <option value="normal" selected>Normal</option>
              <option value="night">Night</option>
            </select>
          </div>
        </div>

        <!-- Separate row: segmented switch, loads the saved configuration 1 / 2 / 3 -->
        <div class="preset-row" id="presetRow">
          <div class="preset-buttons" id="presetButtons" role="group">
            <button
              type="button"
              class="preset-btn active"
              id="presetBtn1"
              data-preset="1"
              aria-pressed="true"
            >
              1
            </button>
            <button
              type="button"
              class="preset-btn"
              id="presetBtn2"
              data-preset="2"
              aria-pressed="false"
            >
              2
            </button>
            <button
              type="button"
              class="preset-btn"
              id="presetBtn3"
              data-preset="3"
              aria-pressed="false"
            >
              3
            </button>
          </div>
        </div>

        <div class="section-block section-block-source">
          <label for="sourceLang" class="source-lang-label"
            >Source Language</label
          >
          <div class="row controls-row">
            <select
              id="sourceLang"
              class="source-lang-select"
              title="Source language"
            >
              <option value="de">German</option>
              <option value="en">English</option>
              <option value="fr">French</option>
              <option value="nl" selected>Dutch</option>
              <option value="pl">Polish</option>
              <option value="pt">Portuguese</option>
              <option value="ru">Russian</option>
              <option value="tr">Turkish</option>
              <option value="uk">Ukrainian</option>
            </select>
            <div class="button-container">
              <button
                type="button"
                id="pasteSource"
                class="icon-btn"
                title="Paste into source"
              >
                📥
              </button>
              <button
                type="button"
                id="copySource"
                class="icon-btn"
                title="Copy source text"
              >
                📋
              </button>
              <button
                type="button"
                id="speakSource"
                class="icon-btn"
                title="Play source"
              >
                🔊
              </button>
            </div>
          </div>
          <div class="source-input-row">
            <textarea
              id="sourceText"
              class="source-textarea"
              placeholder="Enter text..."
            ></textarea>
            <div class="side-buttons">
              <button
                type="button"
                id="micSource"
                class="icon-btn"
                title="Speak"
              >
                🎤
              </button>
              <button
                type="button"
                id="clearSource"
                class="icon-btn clear-btn"
                title="Clear source text"
              >
                ❌
              </button>
            </div>
          </div>

          <div class="row translate-control-row" id="translateControlRow">
            <input
              type="checkbox"
              id="autoTranslate"
              class="auto-translate-checkbox"
            />
            <label
              for="autoTranslate"
              id="autoTranslateLabel"
              class="auto-translate-label"
            >
              Auto-translate
            </label>

            <button
              type="button"
              id="manualTranslateBtn"
              class="translate-btn"
              title="Translate manually"
            >
              Перевести
            </button>
          </div>
        </div>

        <div class="section-block-targets-wrapper">
          <div class="section-block section-block-target-1">
            <label for="targetLang1" class="target-lang-1-label"
              >Target Language 1</label
            >
            <div class="row controls-row">
              <select
                id="targetLang1"
                class="target-lang-1-select"
                title="Target language 1"
              >
                <option value="de">German</option>
                <option value="en" selected>English</option>
                <option value="fr">French</option>
                <option value="nl">Dutch</option>
                <option value="pl">Polish</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="tr">Turkish</option>
                <option value="uk">Ukrainian</option>
              </select>
              <div class="button-container">
                <button
                  type="button"
                  id="copyTarget1"
                  class="icon-btn"
                  title="Copy translation 1"
                >
                  📋
                </button>
                <button
                  type="button"
                  id="speakTarget1"
                  class="icon-btn"
                  title="Play translation 1"
                >
                  🔊
                </button>
              </div>
            </div>
            <textarea
              id="translatedText1"
              class="translated-text-1-textarea"
              placeholder="Translation 1"
              readonly
            ></textarea>
          </div>

          <div class="section-block section-block-target-2">
            <label for="targetLang2" class="target-lang-2-label"
              >Target Language 2</label
            >
            <div class="row controls-row">
              <select
                id="targetLang2"
                class="target-lang-2-select"
                title="Target language 2"
              >
                <option value="de">German</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="nl">Dutch</option>
                <option value="pl">Polish</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="tr">Turkish</option>
                <option value="uk" selected>Ukrainian</option>
              </select>
              <div class="button-container">
                <button
                  type="button"
                  id="copyTarget2"
                  class="icon-btn"
                  title="Copy translation 2"
                >
                  📋
                </button>
                <button
                  type="button"
                  id="speakTarget2"
                  class="icon-btn"
                  title="Play translation 2"
                >
                  🔊
                </button>
              </div>
            </div>
            <textarea
              id="translatedText2"
              class="translated-text-2-textarea"
              placeholder="Translation 2"
              readonly
            ></textarea>
          </div>
        </div>

        <div class="row service-row" id="serviceRow">
          <label for="serviceSelect" id="serviceLabel" class="service-label"
            >Сервис:</label
          >
          <select
            id="serviceSelect"
            class="service-select"
            title="Select translation service"
          >
            <option value="mymemory">
              MyMemory (Free API with daily limit, basic translations)
            </option>
            <option value="libretranslate">
              LibreTranslate (Open-source, no API key required,
              community-hosted)
            </option>
            <option value="google">
              Google Cloud Translate (Paid API, high-quality translations)
            </option>
          </select>
        </div>

        <div class="developer" id="developer">
          <button onclick="alert(location.href);" title="Path to this page">
            Path
          </button>
          <button
            onclick="localStorage.clear(); alert('localStorage cleared');"
            title="Clear local storage"
          >
            Clear LS
          </button>
        </div>
      </div>

      <!-- Empty space (no markup, no text): lets the last scroll step be reached
           on tall screens. Its height is calculated in script.js -->
      <div class="snap-spacer" id="mainSnapSpacer" aria-hidden="true"></div>
    </div>

    <!-- Help modal (content to be added later) -->
    <div
      id="helpAppModal"
      class="app-modal hidden"
      role="dialog"
      aria-modal="true"
    >
      <div class="app-modal-content">
        <button
          type="button"
          id="helpAppCloseBtn"
          class="app-modal-close-btn"
          title="Close"
          aria-label="Close"
        >
          ✕
        </button>
        <div id="helpAppContent"></div>
      </div>
    </div>

    <!-- Settings modal: theme palette, interface language, configurations 1-3
         (languages + visible buttons), reset to defaults -->
    <div
      id="settingsAppModal"
      class="app-modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >
      <div class="app-modal-content">
        <!-- Header: title (localized) + close button -->
        <div class="app-modal-header">
          <h2 class="app-modal-title" id="settingsTitle">Application settings</h2>
          <button
            type="button"
            id="settingsAppCloseBtn"
            class="app-modal-close-btn"
            title="Close"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <!-- Only this part scrolls; the header above stays fixed -->
        <div class="app-modal-body" id="settingsBody">
        <div id="settingsAppContent" class="settings-app-content">
          <div class="thema-wrapper">
            <div class="thema-group" id="themaGroup">
              <label for="themaSelect" id="labelThema" class="label-thema"
                >Theme</label
              >
              <select
                id="themaSelect"
                class="thema-select"
                title="Select theme"
              ></select>
            </div>
          </div>

          <div class="interface-wrapper">
            <div class="interface-group" id="uiLanguageWrapper">
              <label for="uiLangSelect" id="uiLangLabel" class="label-interface"
                >Interface:</label
              >
              <select
                class="interface-select"
                id="uiLangSelect"
                title="Select interface language"
              >
                <option value="de">Deutsch</option>
                <option selected value="en">English</option>
                <option value="fr">Français</option>
                <option value="nl">Nederlands</option>
                <option value="pl">Polski</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="tr">Türkçe</option>
                <option value="uk">Українська</option>
              </select>
            </div>
          </div>

          <!-- Microphone option (global, not part of a configuration) -->
          <div class="mic-wrapper" id="micWrapper">
            <label class="mic-option" for="clearOnMic">
              <input type="checkbox" id="clearOnMic" class="mic-checkbox" />
              <span id="labelClearOnMic">Clear text when the microphone starts</span>
            </label>
          </div>

          <!-- Configurations 1-3: the tabs pick which one is edited here.
               Changes on the main window never write into these. -->
          <div class="preset-wrapper" id="presetWrapper">
            <div class="preset-title" id="labelPresets">Configurations</div>
            <div class="preset-tabs" id="presetTabs" role="group">
              <button
                type="button"
                class="preset-tab active"
                data-preset="1"
                aria-pressed="true"
              >
                1
              </button>
              <button
                type="button"
                class="preset-tab"
                data-preset="2"
                aria-pressed="false"
              >
                2
              </button>
              <button
                type="button"
                class="preset-tab"
                data-preset="3"
                aria-pressed="false"
              >
                3
              </button>
            </div>

            <div class="preset-lang-group">
              <label for="presetSourceLang" id="labelPresetSourceLang"
                >Source Language</label
              >
              <select
                id="presetSourceLang"
                class="preset-lang-select"
                title="Source language"
              ></select>
            </div>
            <div class="preset-lang-group">
              <label for="presetTargetLang1" id="labelPresetTargetLang1"
                >Target Language 1</label
              >
              <select
                id="presetTargetLang1"
                class="preset-lang-select"
                title="Target language 1"
              ></select>
            </div>
            <div class="preset-lang-group">
              <label for="presetTargetLang2" id="labelPresetTargetLang2"
                >Target Language 2</label
              >
              <select
                id="presetTargetLang2"
                class="preset-lang-select"
                title="Target language 2"
              ></select>
            </div>

            <!-- Per-section visibility of the buttons (checkboxes are built in script.js) -->
            <div class="buttons-settings-wrapper" id="buttonsSettingsWrapper">
              <div class="buttons-settings-title" id="labelVisibleButtons">
                Visible buttons
              </div>
              <div
                class="button-visibility-groups"
                id="buttonVisibilityGroups"
              ></div>
            </div>
          </div>

          <div class="reset-settings-group" id="resetSettingsGroup">
            <button
              type="button"
              class="reset-settings-btn"
              id="resetSettingsBtn"
              title="Reset to default settings"
            >
              <span class="reset-icon">🔄</span>
            </button>
            <span class="reset-settings-text" id="resetSettingsText"
              >Reset defaults</span
            >
          </div>
        </div>
        <!-- Empty space below the last block (height calculated in script.js) -->
        <div class="snap-spacer" id="settingsSnapSpacer" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </body>
</html>
